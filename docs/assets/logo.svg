  <!-- trophy cup -->
  <g stroke="url(#cup)" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M52 78 L52 108 A26 26 0 0 0 78 134"/>
    <path d="M52 78 L78 78"/>
    <path d="M188 78 L188 108 A26 26 0 0 1 162 134"/>
    <path d="M188 78 L162 78"/>
    <path d="M78 78 A46 46 0 0 0 162 78 L162 96 A46 46 0 0 1 78 96 Z" fill="url(#cup)" fill-opacity="0.25"/>
    <path d="M120 124 L120 148"/>
    <path d="M92 176 L148 176 L142 148 L98 148 Z"/>
  </g>
</svg>
