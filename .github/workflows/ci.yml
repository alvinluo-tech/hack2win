name: CI Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Test CLI Suite (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    env:
      PYTHONIOENCODING: "utf-8"
      PYTHONUTF8: "1"
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Syntax & Lint Check
        run: |
          python -m py_compile scripts/verify_project.py
          python -m py_compile scripts/verify_production_complexity.py
          python -m py_compile scripts/ui_shot.py
          python -m py_compile scripts/list_skills.py
          python -m py_compile scripts/validate_skill.py
          python -m py_compile scripts/update_check.py

      # Hard gate: the skill package's own structural invariants (reference-index
      # bijection, adapter coverage, config contract, bilingual sync, encoding guards).
      - name: Skill Package Structural Invariants
        run: python scripts/validate_skill.py

      - name: Run CLI Smoke Tests
        run: |
          python scripts/list_skills.py
          python scripts/update_check.py --json
          python scripts/verify_project.py --help
          python scripts/verify_production_complexity.py --help
          python scripts/ui_shot.py --help
          python scripts/validate_skill.py --help
          python scripts/update_check.py --help
